<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1e3e47"/><stop offset="1" stop-color="#10202f"/></linearGradient></defs><rect width="1440" height="850" rx="28" fill="url(#bg)"/><rect x="50" y="50" width="1340" height="750" rx="20" fill="#101d2a" stroke="#35505c"/><path d="M50 123h1340M253 123v677" stroke="#2b3c4c"/><g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="94" fill="#eff8fc" font-size="24" font-weight="600">△  Prism Interview</text><text x="1100" y="92" fill="#89abbb" font-size="14">WORKSPACE · ILLUSTRATIVE DEMO</text><rect x="72" y="155" width="160" height="46" rx="8" fill="#1c3a40"/><text x="92" y="185" fill="#78e3cd" font-size="18">Conversation</text><text x="92" y="244" fill="#8199aa" font-size="18">Your materials</text><text x="92" y="301" fill="#8199aa" font-size="18">Models</text><text x="92" y="358" fill="#8199aa" font-size="18">Session history</text><text x="92" y="742" fill="#708b9b" font-size="13">WINDOWS · OPEN SOURCE</text><text x="284" y="169" fill="#e8f3fa" font-size="27" font-weight="600">Stay with the conversation.</text><text x="284" y="201" fill="#91a6b7" font-size="15">English, Chinese and your own preparation — together.</text><rect x="1150" y="149" width="207" height="43" rx="9" fill="#6be1c5"/><text x="1175" y="176" fill="#10272b" font-size="16" font-weight="600">Start listening</text><rect x="283" y="232" width="591" height="530" rx="13" fill="#152636" stroke="#304354"/><text x="306" y="269" fill="#e2eff5" font-size="18" font-weight="600">Bilingual conversation</text><text x="713" y="268" fill="#7c9aad" font-size="12">Follow latest  ◉</text><rect x="303" y="294" width="551" height="196" rx="10" fill="#1b3040"/><text x="325" y="324" fill="#6be1c5" font-size="13">SPEAKER 1 · INTERVIEWER</text><text x="325" y="360" fill="#f0f6fa" font-size="19">Walk me through a project where you</text><text x="325" y="390" fill="#f0f6fa" font-size="19">had to balance speed and reliability.</text><path d="M325 408h506" stroke="#345063"/><text x="325" y="441" fill="#c1d5df" font-size="18">请介绍一个你需要在速度与可靠性之间</text><text x="325" y="470" fill="#c1d5df" font-size="18">进行权衡的项目。</text><text x="325" y="539" fill="#6c879a" font-size="13">YOUR PREPARATION</text><text x="325" y="573" fill="#bacdd8" font-size="17">CV.pdf · Project notes.docx · Role description.pdf</text><rect x="303" y="616" width="551" height="120" rx="10" fill="#11202d"/><text x="325" y="649" fill="#8ab0c0" font-size="13">YOU CONTROL THE SESSION</text><text x="325" y="681" fill="#d4e3eb" font-size="16">Local recognition · Your choice of answer model</text><text x="325" y="710" fill="#91adbb" font-size="15">Optional local history · No automatic speech</text><rect x="898" y="232" width="460" height="530" rx="13" fill="#152636" stroke="#304354"/><text x="921" y="269" fill="#e2eff5" font-size="18" font-weight="600">Answer guidance</text><text x="922" y="314" fill="#6be1c5" font-size="12">GROUNDED IN YOUR MATERIALS</text><text x="922" y="352" fill="#eaf3f7" font-size="18">In my last project, I first defined</text><text x="922" y="381" fill="#eaf3f7" font-size="18">the reliability target, then measured</text><text x="922" y="410" fill="#eaf3f7" font-size="18">where the time was being spent.</text><text x="922" y="453" fill="#adc5d0" font-size="17">在上一个项目中，我先明确可靠性目标，</text><text x="922" y="481" fill="#adc5d0" font-size="17">再测量各环节的耗时。</text><path d="M922 506h411" stroke="#30495b"/><text x="922" y="546" fill="#eaf3f7" font-size="18">I would explain the trade-off with</text><text x="922" y="575" fill="#eaf3f7" font-size="18">the actual results from my notes.</text><text x="922" y="618" fill="#adc5d0" font-size="17">我会结合项目记录中的实际结果，</text><text x="922" y="646" fill="#adc5d0" font-size="17">说明这一权衡。</text><rect x="922" y="696" width="188" height="34" rx="7" fill="#213b45"/><text x="938" y="719" fill="#8ddcc9" font-size="13">↗ Project notes · example</text></g></svg>
